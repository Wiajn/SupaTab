name: fleet_manager
description: Fleet management app with PDF417 scanning and offline sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4

  # Supabase
  supabase_flutter: ^2.3.4

  # Local database (offline-first)
  drift: ^2.21.0
  drift_flutter: 0.2.2
  sqlite3_flutter_libs: ^0.5.20

  # Barcode scanning (PDF417 via MLKit)
  mobile_scanner: ^5.2.1

  # Camera (guided photo capture)
  camera: ^0.11.0+1

  # Sync triggers
  battery_plus: ^6.0.1
  connectivity_plus: ^6.0.3

  # Storage & utilities
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  permission_handler: ^11.3.1

  # UI
  fl_chart: ^0.68.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.21.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.9
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E00600"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icon/
